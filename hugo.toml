baseURL = "https://mr-lk-lf.github.io/web/"
title = "lowkey lofison"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false
enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]
paginate = 3


[languages]
  [languages.en]
    languageName = "English"
    languageCode = "en"
    contentDir = "content/en"
    weight = 1
    [languages.en.params]
      tagline = "We build for artists, devs and anyone who wants fair tools and content."
      lost = ["404: not found", "decoding the signal", "nothing is lost", "try cd ~"]
  [languages.es]
    languageName = "Español"
    languageCode = "es"
    contentDir = "content/es"
    weight = 2
    [languages.es.params]
      tagline = "Construimos para artistas, devs y para quienes quieren herramientas y contenido justos."
      lost = ["404: no encontrado", "decodificando la señal", "nada se pierde", "prueba cd ~"]

[params]
  github = "https://github.com/mr-lk-lf"
  lofisons = "https://lofisons.com"
  x = "https://x.com/lowkey_lofison"
  youtube = "https://www.youtube.com/@lowkey_lofison"

[markup.goldmark.renderer]
  unsafe = false

[markup.highlight]
  noClasses = false

[outputs]
  home = ["HTML", "RSS"]
