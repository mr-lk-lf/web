<!doctype html>
<html lang="{{ site.Language.LanguageCode }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} · {{ site.Title }}{{ end }}</title>
  <meta name="description" content="{{ with .Params.summary }}{{ . }}{{ else }}{{ site.Params.tagline }}{{ end }}">
  {{ range .AllTranslations }}<link rel="alternate" hreflang="{{ .Language.LanguageCode }}" href="{{ .Permalink }}">
  {{ end }}
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230b0b0a'/%3E%3Cpath d='M3 3h10v10H3z' fill='none' stroke='%23d8d6cf'/%3E%3C/svg%3E">
  {{ $css := resources.Get "css/main.css" | resources.Minify | resources.Fingerprint }}
  <link rel="stylesheet" href="{{ $css.RelPermalink }}">
</head>
<body>
<canvas id="bayer" aria-hidden="true"></canvas>
<main class="sheet">
  <span class="ticks" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
  {{ partial "head.html" . }}
  {{ block "main" . }}{{ end }}
</main>
{{ $js := resources.Get "js/bayer.js" | resources.Minify | resources.Fingerprint }}<script src="{{ $js.RelPermalink }}" defer></script>
</body>
</html>
