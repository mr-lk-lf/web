{{ $pag := .Paginate ((where site.RegularPages "Section" "projects").ByDate.Reverse) }}
<ol class="list">
{{ range $pag.Pages }}
  <li>
    <a href="{{ .RelPermalink }}">{{ .Title }}</a>
    <span class="meta">{{ .Params.language }} · {{ .Params.license }} · {{ .Date | time.Format "Jan 2006" }}</span>
    <span class="mute">{{ .Params.summary }}</span>
  </li>
{{ end }}
</ol>
{{ partial "pager.html" . }}
