{{ $pag := .Paginate ((where site.RegularPages "Section" "projects").ByDate.Reverse) }}
<ol class="list">
{{ range $pag.Pages }}
  <li>
    <a href="{{ .RelPermalink }}">{{ .Title }}</a>
    <span class="meta"><span class="lang">{{ .Params.language }}</span> · {{ .Params.license }} · <time>{{ .Date | time.Format "2006-01" }}</time></span>
    <span class="sum">{{ .Params.summary }}</span>
  </li>
{{ end }}
</ol>
{{ partial "pager.html" . }}
